# =============================================================================
#  SafeStitch app version - the ONE place to change it.
# =============================================================================
#
#  versionCode  Whole number that Google Play uses to tell builds apart.
#               It MUST go up by at least 1 for every AAB you upload to Play
#               (internal testing included). Play rejects a repeated number.
#
#  versionName  The version people see, for example 1.0.0 -> 1.0.1 -> 1.1.0.
#
#  Easiest way to bump both:   ./scripts/bump-version.sh 1.0.1
#  (adds 1 to versionCode and sets versionName to 1.0.1)
# =============================================================================
versionCode=1
versionName=1.0.0
