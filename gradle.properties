# Gradle settings for SafeStitch.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# The configuration cache is intentionally OFF: release signing reads the upload-key
# password from the macOS Keychain while Gradle configures the build, and we do not
# want that value persisted in Gradle's configuration-cache files.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
